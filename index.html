<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parts Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html { overflow: hidden; }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 18px;
            margin: 0;
            padding: 40px 20px;
            overflow-y: hidden;
        }
        #app {
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid #fff;
            border-radius: 6px;
            padding: 40px;
        }
        h1 {
            font-size: 2.6em;
            font-weight: 900;
            color: #00e5b0;
            margin: 0 0 30px 0;
            line-height: 1.1;
        }
        #intro {
            margin-bottom: 60px;
            line-height: 1.65;
        }
        .input-container {
            display: flex;
            width: 100%;
        }
        #user-input-top, #user-input-bottom {
            flex-grow: 1;
            padding: 14px;
            font-size: 18px;
            background: #e8e8e8;
            color: #111;
            border: none;
            outline: none;
        }
        #user-input-top::placeholder, #user-input-bottom::placeholder {
            color: #666;
        }
        button {
            padding: 14px 24px;
            font-size: 18px;
            background: #d4d4d4;
            color: #111;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #bbb; }
        button:disabled { background: #888; color: #555; cursor: default; }
        #chatbox {
            width: 100%;
            border: 1px solid #444;
            padding: 14px;
            margin: 0;
            min-height: 36px;
            background: #000;
        }
        #input-container-bottom { display: none; }
        .user { color: #ccc; margin: 5px 0; }
        .bot { color: #fff; margin: 5px 0; }
        .bot-content { margin-top: 2px; }
        .bot-content p { margin: 12px 0; }
        .bot-content ul, .bot-content ol { margin: 4px 0; padding-left: 20px; }
        .bot-content code { background: #222; padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
        .bot-content pre { background: #222; padding: 8px; border-radius: 4px; overflow-x: auto; }
        .bot-content pre code { background: none; padding: 0; }
        .citation-unknown { font-size: 0.85em; vertical-align: super; color: #ff6b35; cursor: help; }
        .citation-wrap { position: relative; display: inline-block; }
        .citation-wrap a { font-size: 0.85em; vertical-align: super; color: #00e5b0; }
        .citation-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #f0f0f0;
            padding: 10px 13px;
            border-radius: 7px;
            font-size: 0.82em;
            width: 300px;
            z-index: 200;
            box-shadow: 0 3px 12px rgba(0,0,0,0.35);
            word-wrap: break-word;
            line-height: 1.45;
        }
        .citation-wrap:hover .citation-tooltip { display: inline-block; }
        .citation-wrap::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            height: 6px;
        }
        .citation-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: #222;
        }
        .ct-title { font-weight: bold; margin-bottom: 5px; color: #fff; display: block; }
        .ct-url { color: #7ecfff; font-size: 0.9em; margin-bottom: 5px; word-break: break-all; }
        .ct-summary { margin-bottom: 5px; color: #ddd; }
        .ct-filetype { color: #aaa; font-size: 0.88em; }
        .streaming-cursor::after {
            content: '▋';
            animation: blink 0.7s step-end infinite;
            color: #00e5b0;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="app">
        <h1>Dealership Management Assistant</h1>
        <div id="intro">
        </div>

        <div id="input-container-top" class="input-container">
            <input type="text" id="user-input-top" placeholder="Ask a question..." onkeypress="if(event.key === 'Enter') sendMessage('user-input-top')">
            <button id="send-btn-top" onclick="sendMessage('user-input-top')">Send</button>
        </div>
        <div id="chatbox"></div>
        <div id="input-container-bottom" class="input-container">
            <input type="text" id="user-input-bottom" placeholder="Ask a question..." onkeypress="if(event.key === 'Enter') sendMessage('user-input-bottom')">
            <button id="send-btn-bottom" onclick="sendMessage('user-input-bottom')">Send</button>
        </div>
    </div>

    <script>
        const API_URL = "https://fo5vfvlruw7qe7pqbf3ftjg2ky0fmeir.lambda-url.us-east-1.on.aws/";

        const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

        function renderAnswer(answer, sources) {
            const raw = answer
                .replace(/\[(\d+)\]/g, '<cite data-n="$1"></cite>')
                .replace(/\[\?\]/g, '<span class="citation-unknown" title="Missing source metadata">[?]</span>');
            return marked.parse(raw).replace(/<cite data-n="(\d+)"><\/cite>/g, (match, num) => {
                const src = sources[parseInt(num) - 1];
                if (!src || !src.productUrl) return match;
                const title = src.title
                    ? `<span class="ct-title"><a href="${esc(src.productUrl)}" target="_blank" style="color:#7ecfff;text-decoration:underline;">${esc(src.title)}</a></span>`
                    : '';
                const image = src.productImage
                    ? `<span style="display:block;margin-top:6px;"><img src="${esc(src.productImage)}" style="max-width:100%;max-height:120px;object-fit:contain;border-radius:4px;"></span>`
                    : '';
                return `<span class="citation-wrap"><a href="${esc(src.productUrl)}" target="_blank">[${num}]</a><span class="citation-tooltip">${title}${image}</span></span>`;
            });
        }

        function setInputsDisabled(disabled) {
            document.getElementById("user-input-top").disabled = disabled;
            document.getElementById("user-input-bottom").disabled = disabled;
            document.getElementById("send-btn-top").disabled = disabled;
            document.getElementById("send-btn-bottom").disabled = disabled;
        }

        async function sendMessage(inputId) {
            const inputField = document.getElementById(inputId);
            const chatbox = document.getElementById("chatbox");
            const question = inputField.value.trim();
            if (!question) return;

            document.getElementById("user-input-top").value = "";
            document.getElementById("user-input-bottom").value = "";
            document.getElementById("input-container-bottom").style.display = "none";
            setInputsDisabled(true);

            chatbox.innerHTML = `<div class="user"><b>You:</b> ${esc(question)}</div>`;

            const botDiv = document.createElement("div");
            botDiv.className = "bot";
            botDiv.innerHTML = '<b>Bot:</b><div class="bot-content streaming-cursor" id="bot-content"></div>';
            chatbox.appendChild(botDiv);
            const contentDiv = document.getElementById("bot-content");

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                let streamedText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // hold incomplete last line

                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        let evt;
                        try { evt = JSON.parse(line.slice(6)); } catch { continue; }

                        if (evt.type === "chunk") {
                            streamedText += evt.text;
                            contentDiv.innerHTML = marked.parse(streamedText);
                        } else if (evt.type === "done") {
                            contentDiv.classList.remove("streaming-cursor");
                            contentDiv.innerHTML = renderAnswer(evt.answer, evt.sources || []);
                        } else if (evt.type === "error") {
                            contentDiv.classList.remove("streaming-cursor");
                            contentDiv.innerHTML = `<span style="color:red">${esc(evt.message)}</span>`;
                        }
                    }
                }

                // Ensure cursor is removed if stream ended without a done event
                contentDiv.classList.remove("streaming-cursor");

            } catch (error) {
                console.error(error);
                contentDiv.classList.remove("streaming-cursor");
                contentDiv.innerHTML = `<span style="color:red">Could not reach backend: ${esc(error.message)}</span>`;
            }

            setInputsDisabled(false);
            document.getElementById("input-container-bottom").style.display = "flex";
        }
    </script>
</body>
</html>
