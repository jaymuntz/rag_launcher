AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AI Chatbot — Bedrock Managed Knowledge Base with S3 data source,
  CloudFront-served frontend and logs site, RAG Lambda functions, and ingest pipeline.

Parameters:

  AppName:
    Type: String
    Description: >-
      Short identifier used as a prefix for all resource names.
      Lowercase letters, numbers, and hyphens only. Must start with a letter. Max 20 characters.
    AllowedPattern: '^[a-z][a-z0-9-]{0,19}$'
    ConstraintDescription: Must be lowercase, start with a letter, use only alphanumeric and hyphens, max 20 chars.

  AppSuffix:
    Type: String
    Description: Short random suffix appended to S3 bucket names to prevent global name collisions. Generated once by deploy.py and preserved across re-deploys.

  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket that holds all Lambda deployment packages

  RagNodeFunctionS3Key:
    Type: String
    Description: S3 key for the RAG Node.js Lambda deployment package


  RagSignerFunctionS3Key:
    Type: String
    Description: S3 key for the Lambda@Edge request-signing deployment package

  RagSignerSuffix:
    Type: String
    Description: Short unique suffix appended to the signer function name to avoid collisions while Lambda@Edge replicas drain


Resources:

  # ============================================================
  # S3 — shared data bucket (RAG data, frontend assets, logs)
  # ============================================================

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AppName}-rag-chatbot-data-${AppSuffix}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2008-10-17'
        Id: PolicyForCloudFrontPrivateContent
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${DataBucket}/*
            Condition:
              ArnLike:
                AWS:SourceArn:
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ChatbotDistribution}
          - Sid: AllowLambdaObjectAccess
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt RagNodeFunctionRole.Arn
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub arn:aws:s3:::${DataBucket}/*
          - Sid: AllowLambdaListBucket
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt RagNodeFunctionRole.Arn
            Action: s3:ListBucket
            Resource: !Sub arn:aws:s3:::${DataBucket}

  # ============================================================
  # CloudFront — chatbot frontend (ChatbotAlias → /front)
  # ============================================================

  ChatbotOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AppName}-chatbot-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ChatbotDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-chat-frontend
      DistributionConfig:
        Comment: chatbot public
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

        Origins:
          - Id: s3-chatbot-origin
            DomainName: !Sub ${DataBucket}.s3.amazonaws.com
            OriginPath: /front
            OriginAccessControlId: !GetAtt ChatbotOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: lambda-api-origin
            DomainName: !Select [2, !Split ["/", !GetAtt RagNodeFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: s3-chatbot-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          AllowedMethods:
            - HEAD
            - GET
          CachedMethods:
            - HEAD
            - GET
          FunctionAssociations: []
          LambdaFunctionAssociations: []
          TrustedSigners: []
          TrustedKeyGroups: []
          FieldLevelEncryptionId: ''
          SmoothStreaming: false
        Restrictions:
          GeoRestriction:
            RestrictionType: none
            Locations: []
        CacheBehaviors:
          - PathPattern: /api*
            TargetOriginId: lambda-api-origin
            ViewerProtocolPolicy: https-only
            Compress: false
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - HEAD
              - GET
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            LambdaFunctionAssociations:
              - EventType: origin-request
                LambdaFunctionARN: !Ref RagSignerFunctionVersion
                IncludeBody: true
        CustomErrorResponses: []
        OriginGroups:
          Quantity: 0
          Items: []

  # ============================================================
  # Bedrock Knowledge Base
  # ============================================================

  KnowledgeBaseS3Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub AmazonBedrockS3PolicyForKnowledgeBase-${AppName}-products-kb
      Path: /service-role/
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ListBucketStatement
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub arn:aws:s3:::${DataBucket}
            Condition:
              StringEquals:
                aws:ResourceAccount: !Ref AWS::AccountId
          - Sid: S3GetObjectStatement
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub arn:aws:s3:::${DataBucket}/*
            Condition:
              StringEquals:
                aws:ResourceAccount: !Ref AWS::AccountId

  KnowledgeBaseCloudWatchPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub AmazonBedrockCloudWatchPolicyForKnowledgeBase-${AppName}-products-kb
      Path: /service-role/
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudWatchWritePermissionStatement
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: AWS/Bedrock/KnowledgeBases

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-products-kb-role
      Path: /service-role/
      Description: Bedrock Knowledge Base access
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustPolicyStatement
            Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      ManagedPolicyArns:
        - !Ref KnowledgeBaseS3Policy
        - !Ref KnowledgeBaseCloudWatchPolicy
      Policies:
        - PolicyName: knowledgebase-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource: !Sub arn:aws:aoss:*:*:collection/*

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${AppName}-products-kb
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: MANAGED
        ManagedKnowledgeBaseConfiguration:
          EmbeddingModelType: MANAGED
      Tags: {}

  KnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${AppName}-products-kb-data-source
      KnowledgeBaseId: !Ref KnowledgeBase
      DataDeletionPolicy: DELETE
      VectorIngestionConfiguration:
        ParsingConfiguration:
          ParsingStrategy: SMART_PARSING
      DataSourceConfiguration:
        Type: MANAGED_KNOWLEDGE_BASE_CONNECTOR
        ManagedKnowledgeBaseConnectorConfiguration:
          DeletionProtectionConfiguration:
            DeletionProtectionStatus: DISABLED
          MediaExtractionConfiguration:
            AudioExtractionConfiguration:
              AudioExtractionStatus: DISABLED
            VideoExtractionConfiguration:
              VideoExtractionStatus: ENABLED
            ImageExtractionConfiguration:
              ImageExtractionStatus: ENABLED
          ConnectorParameters:
            type: S3
            filterConfiguration:
              maxFileSizeInMegaBytes: '500'
              inclusionPrefixes:
                - knowledgebase-files/
            version: '1'
            aclEnabled: false
            connectionConfiguration:
              bucketName: !Ref DataBucket
              bucketOwnerAccountId: !Ref AWS::AccountId
              bucketArn: !Sub arn:aws:s3:::${DataBucket}

  # ============================================================
  # Lambda — RAG Node.js (nodejs24.x) with Function URL
  # ============================================================

  RagNodeFunctionBasicExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub AWSLambdaBasicExecutionRole-${AppName}-rag-node
      Path: /service-role/
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: logs:CreateLogGroup
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-rag-node:*

  RagNodeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-rag-node-role
      Path: /service-role/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - !Ref RagNodeFunctionBasicExecutionPolicy
      Policies:
        - PolicyName: bedrock-agenticstream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:AgenticRetrieveStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::${DataBucket}/*

  RagNodeFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub ${AppName}-rag-node
      Description: ''
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt RagNodeFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref RagNodeFunctionS3Key
      MemorySize: 128
      Timeout: 300
      PackageType: Zip
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      TracingConfig:
        Mode: PassThrough
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Sub /aws/lambda/${AppName}-rag-node
      RecursiveLoop: Terminate
      FileSystemConfigs: []
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBase
          DATA_BUCKET: !Ref DataBucket

  RagNodeFunctionUrl:
    Type: AWS::Lambda::Url
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TargetFunctionArn: !Ref RagNodeFunction
      InvokeMode: RESPONSE_STREAM
      AuthType: AWS_IAM

  # Allows the Lambda@Edge signer role to invoke the function URL with IAM signing
  RagNodeFunctionSignerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt RagNodeFunction.Arn
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      Principal: !GetAtt RagSignerFunctionRole.Arn

  # ============================================================
  # Lambda@Edge — request signer (adds SigV4 auth headers for Lambda URL)
  # ============================================================

  RagSignerFunctionBasicExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub AWSLambdaBasicExecutionRole-${AppName}-rag-signer-${RagSignerSuffix}
      Path: /service-role/
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:*:*:*

  RagSignerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-rag-signer-${RagSignerSuffix}-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref RagSignerFunctionBasicExecutionPolicy
      Policies:
        - PolicyName: invoke-rag-node
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RagNodeFunction.Arn

  RagSignerFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: !Sub ${AppName}-rag-signer-${RagSignerSuffix}
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RagSignerFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref RagSignerFunctionS3Key
      Timeout: 30
      MemorySize: 256

  RagSignerFunctionVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref RagSignerFunction
      Description: !Sub "Signer for ${AppName} — key ${RagSignerFunctionS3Key}"


Outputs:

  KnowledgeBaseId:
    Description: Bedrock Knowledge Base ID
    Value: !Ref KnowledgeBase

  ChatbotDistributionDomain:
    Description: CloudFront domain for the chatbot frontend (CNAME this from your ChatbotAlias)
    Value: !GetAtt ChatbotDistribution.DomainName

  RagNodeFunctionUrl:
    Description: Function URL for the streaming RAG Node.js Lambda
    Value: !GetAtt RagNodeFunctionUrl.FunctionUrl

  DataBucketName:
    Description: S3 bucket name (RAG data at /knowledgebase-files, frontend at /front)
    Value: !Ref DataBucket
